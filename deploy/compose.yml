# Run your own public DigBlock server: edit the environment values
# below, then `docker compose up -d`.
#
# The only requirement is UDP 4433 reachable from the internet (router
# port-forward and/or firewall rule). You're listed at the public IP
# this machine registers from, and on registration the master probes
# that address for real - if it can't reach you, you won't be listed.
#
# World data (append-only edit journals, one directory per seed holding
# a shard per 256x256-block region) lives in ./data - that directory is
# the complete backup. A pre-sharding single-file journal migrates in
# place on first boot; nothing needs doing by hand.
#
# ./data also holds "master-key" from your first registration. It is what
# lets THIS server re-register its address later; without it, an address
# someone else is live on cannot be reclaimed. Back it up with the rest.
#
# More than one server on this machine: give each its own folder and its
# own port, and the port is the one line below - nothing else changes.
# That one value is the port published on this machine, the port the
# server tells the master it is reachable at, and the name of the compose
# project. The name is what keeps two copies of this file apart: compose
# names a project after its folder unless told otherwise, and two folders
# that happened to share a name would take turns replacing each other's
# container; named after the port, two folders collide only when they
# could not both run anyway. The master lists ports 4433–4499 and nothing
# outside that block, so one firewall rule covers every server you will
# run here.
x-port: &port "4433"
name: *port
services:
  digblock:
    # Pin a release by replacing "latest" with a version like "0.1.0".
    image: ghcr.io/zaneris/digblock-server:latest
    restart: unless-stopped
    ports:
      - target: 4433
        published: *port
        protocol: udp
    volumes:
      - ./data:/data
    environment:
      # The port players reach this machine at (x-port above). Inside
      # the container the server always listens on 4433.
      DIGBLOCK_ADVERTISE_PORT: *port
      # Shown in the public server list. Letters, digits, spaces, - and
      # _; up to 24 characters (the master strips anything else).
      DIGBLOCK_SERVER_NAME: "My DigBlock World"
      # Optional override for IP/host players connect to.
      #DIGBLOCK_ADVERTISE_HOST: "play.example.com"
      # Optional world seed (any number). Changing it later starts a
      # fresh world; the old world's journal stays in ./data and comes
      # back if you switch the seed back.
      #DIGBLOCK_SEED: "42"
      # Replacing a world is never something an upgrade does on its own.
      # If an update ships a new save format, the server REFUSES to start
      # and leaves your world exactly as it is, rather than replacing it
      # and telling you afterwards. Two ways forward: go back to the
      # version that wrote it, or set this to "true" for one start, which
      # renames the world to a .vN.bak beside it and begins a fresh one.
      # It does nothing while your world is readable, so it is safe to
      # leave set - but unset it once you are through.
      #DIGBLOCK_ARCHIVE_WORLD: "true"
      # The other half, and deliberately not the same switch: an update
      # that changes how new terrain is GENERATED leaves existing worlds
      # on the generator that made them, forever. Set this to "true" to
      # give this world up for the new terrain instead - same .vN.bak,
      # same fresh start. Separate from the one above so a switch you set
      # to recover an unreadable world cannot quietly trade a perfectly
      # good one later.
      #DIGBLOCK_ADOPT_TERRAIN: "true"
      # Optional admins, by ACCOUNT ID, comma-separated. A player finds
      # theirs in the game: Multiplayer -> Account -> Copy ID. They get
      # /help /tp /ban /ban-list /unban in chat.
      #
      # Ids, not names: a display name is something anyone can ask for, so
      # granting admin by name meant anyone who read the player list could
      # take the server. A name works too and is looked up once when the
      # server starts, but the id is what is stored either way.
      #DIGBLOCK_ADMIN_IDS: "b2379408-3102-8b68-b56b-5774dec269b8"
