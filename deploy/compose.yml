# Run your own public DigBlock server: edit the environment values
# below, then `docker compose up -d`.
#
# The only requirement is UDP 4433 reachable from the internet (router
# port-forward and/or firewall rule). You're listed at the public IP
# this machine registers from, and on registration the master probes
# that address for real - if it can't reach you, you won't be listed.
#
# World data (append-only edit journals, one directory per seed holding
# a shard per 256x256-block region) lives in ./data - that directory is
# the complete backup. A pre-sharding single-file journal migrates in
# place on first boot; nothing needs doing by hand.
#
# ./data also holds "master-key" from your first registration. It is what
# lets THIS server re-register its address later; without it, an address
# someone else is live on cannot be reclaimed. Back it up with the rest.
services:
  digblock:
    # Pin a release by replacing "latest" with a version like "0.1.0".
    image: ghcr.io/zaneris/digblock-server:latest
    restart: unless-stopped
    ports:
      - "4433:4433/udp"
    volumes:
      - ./data:/data
    environment:
      # Shown in the public server list. Letters, digits, spaces, - and
      # _; up to 24 characters (the master strips anything else).
      DIGBLOCK_SERVER_NAME: "My DigBlock World"
      # Optional override for IP/host players connect to.
      #DIGBLOCK_ADVERTISE_HOST: "play.example.com"
      # Optional world seed (any number). Changing it later starts a
      # fresh world; the old world's journal stays in ./data and comes
      # back if you switch the seed back.
      #DIGBLOCK_SEED: "42"
      # Optional admins, by ACCOUNT ID, comma-separated. A player finds
      # theirs in the game: Multiplayer -> Account -> Copy ID. They get
      # /help /tp /ban /ban-list /unban in chat.
      #
      # Ids, not names: a display name is something anyone can ask for, so
      # granting admin by name meant anyone who read the player list could
      # take the server. A name works too and is looked up once when the
      # server starts, but the id is what is stored either way.
      #DIGBLOCK_ADMIN_IDS: "b2379408-3102-8b68-b56b-5774dec269b8"
