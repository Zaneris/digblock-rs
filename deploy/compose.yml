# Run your own public DigBlock server: edit the environment values
# below, then `docker compose up -d`.
#
# The only requirement is UDP 4433 reachable from the internet (router
# port-forward and/or firewall rule). You're listed at the public IP
# this machine registers from, and on registration the master probes
# that address for real - if it can't reach you, you won't be listed.
#
# World data (an append-only edit journal, one file per seed) lives in
# ./data - that directory is the complete backup.
services:
  digblock:
    # Pin a release by replacing "latest" with a version like "0.1.0".
    image: ghcr.io/zaneris/digblock-server:latest
    restart: unless-stopped
    ports:
      - "4433:4433/udp"
    volumes:
      - ./data:/data
    environment:
      # Shown in the public server list. Letters, digits, spaces, - and
      # _; up to 24 characters (the master strips anything else).
      DIGBLOCK_SERVER_NAME: "My DigBlock World"
      # Optional override for IP/host players connect to.
      #DIGBLOCK_ADVERTISE_HOST: "play.example.com"
      # Optional world seed (any number). Changing it later starts a
      # fresh world; the old world's journal stays in ./data and comes
      # back if you switch the seed back.
      #DIGBLOCK_SEED: "42"
      # Optional admin: the player joining under this display name gets
      # chat commands — /help /tp /ban /ban-list /unban (bans are by IP,
      # stored in ./data/bans.json).
      #DIGBLOCK_ADMIN_NAME: "YourName"
