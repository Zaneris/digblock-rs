[package]
name = "digblock-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
digblock-core.workspace = true
digblock-assets.workspace = true
digblock-platform.workspace = true
digblock-net.workspace = true
digblock-persist.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
rustc-hash.workspace = true
fontdue.workspace = true
image.workspace = true
web-time.workspace = true
log.workspace = true

# The guarded pipelines' verdict, and nothing else: wgpu's own error-scope
# API cannot report a clean scope in a browser, so `pipeline_builder` reads
# the two scopes off the raw GPUDevice — see `watched` there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

[dev-dependencies]
# Layout tripwire only (frame_layout_matches_wgsl). The workspace pin, for
# the reason digblock-assets uses it: this parses the SHIPPED WGSL, so a
# front end older than the runtime's own naga answers a question about a
# language the runtime no longer speaks.
naga.workspace = true

# `every_pipeline_builds_without_a_gpu` only. wgpu's noop backend stubs the
# HAL but leaves wgpu-core's validation intact, which is the whole point —
# see the test. Kept OFF wasm deliberately: the feature pulls wgpu-core and
# wgpu-hal in, and the browser build otherwise links neither.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wgpu = { workspace = true, features = ["noop"] }
pollster.workspace = true

[lints]
workspace = true
