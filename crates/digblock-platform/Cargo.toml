[package]
name = "digblock-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wgpu.workspace = true
winit.workspace = true
log.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
image.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
	"Window",
	"Document",
	"Element",
	"Event",
	"EventTarget",
	"HtmlCanvasElement",
	"CustomEvent",
	"CustomEventInit",
	# The overlay's host-memory sample (`performance.memory`).
	"Performance",
	# Fullscreen toggle + Android's in-fullscreen orientation lock.
	"Screen",
	"ScreenOrientation",
	"OrientationLockType",
	# The soft-keyboard bridge (webtext.rs).
	"HtmlElement",
	"HtmlInputElement",
	"InputEvent",
	"KeyboardEvent",
	# The screenshot download (webshot.rs).
	"Blob",
	"Url",
	"HtmlAnchorElement",
] }

[lints]
workspace = true
