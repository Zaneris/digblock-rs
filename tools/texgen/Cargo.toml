[package]
name = "texgen"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# For the palettes. `BlockType::node_flecks` and `Essence::palette` are
# the tables that say what a vein's crystals and an essence's chip are
# coloured, and the GI material LUT casts a vein's light from the same
# entry — so what this tool paints and the light the engine throws cannot
# drift apart.
digblock-core.workspace = true
image.workspace = true

[lints]
workspace = true
