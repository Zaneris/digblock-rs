<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>DigBlock</title>
	<!-- With this file present, Cloudflare Pages answers a path it cannot
	     find with a real 404 instead of index.html as a 200. That keeps a
	     missing /pkg module a visible failure in the console and in logs,
	     never "a module with the wrong MIME type". -->
	<meta name="robots" content="noindex">
	<style>
		html, body { height: 100%; margin: 0; background: #000; color: #eee;
			font-family: system-ui, sans-serif; }
		body { display: flex; align-items: center; justify-content: center; }
		main { text-align: center; }
		h1 { letter-spacing: 0.3em; font-size: 40px; margin: 0 0 16px; }
		a { color: #9cf; }
	</style>
</head>
<body>
	<main>
		<h1>DIGBLOCK</h1>
		<p>Nothing lives at this address.</p>
		<p><a href="/">Play at digblock.net</a></p>
	</main>
</body>
</html>
