[package]
name = "digblock-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm-gated: on native targets this crate is an empty rlib,
# so `just check` builds it without pulling wasm-only deps.
[target.'cfg(target_arch = "wasm32")'.dependencies]
digblock-core.workspace = true
digblock-render.workspace = true
digblock-platform.workspace = true
digblock-net.workspace = true
digblock-net-web.workspace = true
digblock-persist.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
console_log.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# The PKCE challenge for sign-in. Same computation as the desktop
# launcher's, pinned to the same RFC test vector in both.
web-sys = { workspace = true, features = [
	"Window",
	"Location",
	"History",
	"Navigator",
	"Clipboard",
	"UrlSearchParams",
	# Chunk-job worker pool (jobs.rs).
	"Worker",
	"WorkerOptions",
	"WorkerType",
	"Blob",
	"BlobPropertyBag",
	"Url",
	"MessageEvent",
	"Event",
	"Request",
	"RequestInit",
	"Response",
	"Headers",
	"Storage",
	"Crypto",
	"EventTarget",
	# AudioContext resume on returning to a visible tab (audio.rs).
	"Document",
	"VisibilityState",
	# Mobile-device detection (is_mobile_browser).
	"MediaQueryList",
	# Safe-area probe (safe_area_insets).
	"Element",
	"HtmlElement",
	"CssStyleDeclaration",
	"AudioContext",
	"AudioContextState",
	"BaseAudioContext",
	"AudioBuffer",
	"AudioBufferSourceNode",
	"AudioNode",
	"AudioParam",
	"AudioDestinationNode",
	"AudioListener",
	"GainNode",
	"PannerNode",
	"PanningModelType",
	"DistanceModelType",
] }

[lints]
workspace = true
