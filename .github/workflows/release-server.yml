# Cut a shareable dedicated-server release:
#   - public multi-arch Docker image (docker/Dockerfile.release — server
#     binary only, env-driven config) for linux/amd64 + linux/arm64
#     (Raspberry Pi 4/5 on a 64-bit OS), pushed to GHCR as :<version>
#     and :latest
#   - standalone binaries for Linux (x86_64 and aarch64, fully static
#     musl) and Windows (x86_64) for hosts without Docker
#   - a GitHub Release carrying the deploy kit (compose.yml with the
#     config inline + README) plus those binaries
#
# On-demand only: Actions → release-server → Run workflow, enter a
# version like 0.1.0. One-time: after the first run, make the
# ghcr.io/zaneris/digblock-server package public (package settings →
# Danger Zone) so self-hosters can pull it without credentials.
#
# The `bump` job writes that version into the tree and commits it to main
# BEFORE anything is built, so the binaries actually report it (the
# server logs it at boot, the client shows it on the settings screen) —
# they bake `env!("CARGO_PKG_VERSION")` at compile time, so a release
# built from an unbumped tree would say 0.1.0 forever. Every later job
# checks out that commit, and the release tag targets it.
#
# This pushes to main: if branch protection ever requires a PR there, the
# job needs an exemption for github-actions[bot] or a PAT that can bypass.

name: release-server

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/zaneris/digblock-server

concurrency:
  group: release-server
  cancel-in-progress: false

jobs:
  # Write the entered version into the tree and commit it to main. Every
  # other job builds from the resulting commit, so what ships and what
  # the repo says are the same thing.
  bump:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Checked before touching anything: this job commits to main, so a
      # typo'd version must not become a commit.
      - name: Validate version
        run: |
          case "${{ inputs.version }}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must be MAJOR.MINOR.PATCH, got '${{ inputs.version }}'" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: main

      # Anchored edits, not a global s/0.1.0/…/ — that string also
      # appears in comments and docs. Cargo.lock records workspace
      # members' versions, so it has to move with them.
      - name: Set version
        run: |
          v='${{ inputs.version }}'
          sed -i "/^\[workspace\.package\]/,/^\[/ s/^version = \".*\"/version = \"$v\"/" Cargo.toml
          sed -i "/^\[package\]/,/^\[/ s/^version = \".*\"/version = \"$v\"/" tools/texgen/Cargo.toml
          sed -i "\|<key>CFBundleShortVersionString</key>|{n;s|<string>.*</string>|<string>$v</string>|;}" apps/ios/xcode/Info.plist
          cargo update --workspace
          git diff --stat

      - name: Commit and push
        id: commit
        run: |
          if git diff --quiet; then
            echo "already at ${{ inputs.version }}, nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: release v${{ inputs.version }}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  image:
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}

      # QEMU covers only the arm64 runtime stage's apt-get; the compile
      # stages cross-compile natively on the amd64 runner (see the
      # $BUILDPLATFORM pin in docker/Dockerfile.release).
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        env:
          # Don't upload the .dockerbuild build-record artifact — the
          # release job downloads artifacts and must only see binaries.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    needs: bump
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: digblock-server-linux-x86_64
          # aarch64 (Raspberry Pi 4/5 on a 64-bit OS) cross-compiles via
          # `cross` — Docker-based, uses the host rustup toolchain, so
          # the target must still be rustup-added.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: digblock-server-linux-aarch64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: digblock-server-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release -p digblock-server --bin digblock-server --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir dist
          src=target/${{ matrix.target }}/release/digblock-server
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: [bump, image, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: digblock-server-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "server-v${{ inputs.version }}" \
            deploy/compose.yml deploy/README.md \
            dist/* \
            --target "${{ needs.bump.outputs.sha }}" \
            --title "Dedicated server v${{ inputs.version }}" \
            --notes "$(cat <<'EOF'
          Run your own public DigBlock server — it lists itself automatically in the in-game server browser.

          **With Docker** (recommended; needs UDP 4433 open to the internet). The image is multi-arch — x86_64 and arm64, so a Raspberry Pi 4/5 running a 64-bit OS works:

          ```sh
          mkdir digblock-server && cd digblock-server
          curl -LO ${{ github.server_url }}/${{ github.repository }}/releases/download/server-v${{ inputs.version }}/compose.yml
          # edit compose.yml: set DIGBLOCK_SERVER_NAME (the rest is optional)
          docker compose up -d
          ```

          **Without Docker**: grab the standalone binary for your platform below (Linux x86_64/aarch64, Windows x86_64) and run it directly, e.g.

          ```sh
          ./digblock-server-linux-x86_64 --server-name "My World"
          ```

          You're listed at the public IP you register from; `--advertise-host` overrides it with a DNS name. Set `DIGBLOCK_ADMIN_NAME` (or `--admin-name`) to your display name for in-game admin chat commands: `/tp`, `/ban`, `/ban-list`, `/unban`.

          Image: `ghcr.io/zaneris/digblock-server:${{ inputs.version }}`. See the attached README.md for operating notes (upgrades, backups, seeds).
          EOF
          )"
