# Build the master image and roll it out to the Azure Container App.
#
# On-demand only (Actions → deploy-master → Run workflow): the master is a
# live service. A restart drops server registrations for up to one
# heartbeat and any in-flight join tokens — all of which recover by
# themselves — but it now also has DURABLE state, so read the storage note
# below before the first deploy. The image goes to GHCR — no ACR needed;
# the Container App pulls ghcr.io as an "other registry" (package must be
# public, or give the app registry credentials).
#
# One-time setup this workflow expects:
#   - Entra app with a federated credential for this repo's main branch,
#     Contributor on the resource group (OIDC — no stored password).
#   - Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
#   - Repo variable: AZURE_RG (the resource group name).
#   - The container app itself created once (name: digblock-master).
#
# STORAGE — accounts live in SQLite at /data/master.db (see AUTH-DESIGN.md).
# The Container App's own filesystem is EPHEMERAL, so without these two the
# first redeploy silently takes every account with it:
#   - An Azure Files share mounted at /data, with nobrl in the volume's
#     mountOptions — set on the APP TEMPLATE's volume (az containerapp
#     update --yaml), not on the environment storage, which has no such
#     field. Without it, cifs forwards SQLite's byte-range locks to the SMB
#     server, where its lock-upgrade sequence fails as "database is locked"
#     on the very first write: the revision dies at Database.Migrate(), the
#     rollout keeps serving the old image, and nothing in the deploy says
#     so. A plain --image update preserves the option once set.
#   - minReplicas = maxReplicas = 1. SQLite is single-writer, and two
#     replicas over SMB is corruption, not contention. It is also what
#     makes nobrl safe: locks stay on the node, and one replica means the
#     node sees every writer there is.
# The app pins the rollback journal to DELETE for the same reason (WAL does
# not work over SMB); that part is in code, not configuration.
#
# SECRETS — the OAuth credentials are Container App secrets surfaced as
# Master__Auth__Google__ClientId / __ClientSecret (and __Facebook__,
# __Microsoft__), never appsettings.json. A provider with no credentials
# configured is simply off: its button never renders. That is how Facebook
# ships dark until its App Review clears — and, with NONE configured, how
# a fresh master admits nobody at all, since joining needs an account.
#
# The redirect URI to register with the provider is /signin-google (and
# /signin-facebook, /signin-microsoft) on this host — ASP.NET's default
# callback path, which the app does not override. A mismatch surfaces only
# as the provider's own redirect_uri_mismatch, with nothing in our logs.
#
# Those are the only settings sign-in needs. The clients' redirect targets
# need no configuration at all: desktop uses loopback (matched by shape)
# and the web origins are compiled in — see RedirectUris.Owned, and change
# it there if the game's domain ever moves.
#
# Note: this is intentionally separate from ci.yml.disabled — CI stays
# off pre-deployment; this only ships the master.

name: deploy-master

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/zaneris/digblock-master

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: apps/master
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy by immutable sha tag, not :latest — the revision records
      # exactly what's running and rollback is a revision activate away.
      - name: Roll out to Container App
        run: |
          az containerapp update \
            --name digblock-master \
            --resource-group "${{ vars.AZURE_RG }}" \
            --image "${{ env.IMAGE }}:${{ github.sha }}"
