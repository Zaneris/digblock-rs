# Build the wasm web client and deploy it to Cloudflare Pages.
#
# The bundle is `just build-web` itself, not a copy of it: the recipe
# content-addresses the glue/wasm pair (see its comment — a mismatched pair
# is a fatal LinkError), and a hand-mirrored build here would eventually
# skew from it. It also re-checks the wasm-bindgen version against
# Cargo.lock, so the pin installed below (0.2.126 — prebuilt, keep in sync
# when the lockfile bumps) fails loudly here instead of at runtime.
# The result is pure static files; Pages serves .wasm with the right MIME
# type out of the box.
#
# One-time setup this workflow expects:
#   - Cloudflare Pages project `digblock` (wrangler pages project create
#     digblock --production-branch main).
#   - Repo secrets: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID.

name: deploy-web

# On-demand only, like deploy-master: releases are chosen, not implied
# by every push that touches the crates.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install just + wasm-bindgen-cli (prebuilt, lockfile-pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen@0.2.126

      - name: Build web bundle
        run: just build-web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          # --commit-dirty silences the "uncommitted changes" warning: the
          # freshly built target/web is untracked by design.
          command: pages deploy target/web --project-name=digblock --branch=main --commit-dirty=true
