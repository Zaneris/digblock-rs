# Build the wasm web client and deploy it to Cloudflare Pages.
#
# Mirrors `just build-web` exactly: cargo build for wasm32, wasm-bindgen
# at the version pinned in Cargo.lock (0.2.126 — installed prebuilt, keep
# in sync when the lockfile bumps), then index.html + pkg/ becomes the
# site. The bundle is pure static files; Pages serves .wasm with the
# right MIME type out of the box.
#
# One-time setup this workflow expects:
#   - Cloudflare Pages project `digblock` (wrangler pages project create
#     digblock --production-branch main).
#   - Repo secrets: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID.

name: deploy-web

# On-demand only, like deploy-master: releases are chosen, not implied
# by every push that touches the crates.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli (prebuilt, lockfile-pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126

      - name: Build web bundle
        run: |
          cargo build -p digblock-web --target wasm32-unknown-unknown --release
          wasm-bindgen --target web --no-typescript --out-dir target/web/pkg \
            target/wasm32-unknown-unknown/release/digblock_web.wasm
          cp apps/web/index.html target/web/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          # --commit-dirty silences the "uncommitted changes" warning: the
          # freshly built target/web is untracked by design.
          command: pages deploy target/web --project-name=digblock --branch=main --commit-dirty=true
