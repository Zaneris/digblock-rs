[workspace]
resolver = "2"
members = [
	"crates/digblock-core",
	"crates/digblock-client",
	"crates/digblock-assets",
	"crates/digblock-platform",
	"crates/digblock-net",
	"crates/digblock-net-native",
	"crates/digblock-net-web",
	"crates/digblock-persist",
	"apps/desktop",
	"apps/ios",
	"apps/server",
	"apps/web",
	"apps/web-worker",
	"tools/texgen",
	"tools/shadercheck",
]

[workspace.package]
version = "0.7.6"
edition = "2024"
license = "MIT"

# Mirrors the justfile/CI `-D warnings` policy in-source, so plain
# `cargo build` and rust-analyzer surface it instead of `just check`
# discovering it later. Each crate opts in via `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"
# A `pub` item inside a private module is reachable by nobody and reads as
# API. Denying it is what keeps a crate's real surface the one in `lib.rs`.
unreachable_pub = "deny"

[workspace.dependencies]
digblock-core = { path = "crates/digblock-core" }
digblock-client = { path = "crates/digblock-client" }
digblock-assets = { path = "crates/digblock-assets" }
digblock-platform = { path = "crates/digblock-platform" }
digblock-net = { path = "crates/digblock-net" }
digblock-net-native = { path = "crates/digblock-net-native" }
digblock-net-web = { path = "crates/digblock-net-web" }
digblock-persist = { path = "crates/digblock-persist" }

wgpu = "30"
# The shader-validation test's front end, and a workspace pin rather than
# a crate-local one because it has to track wgpu's OWN naga generation.
# An older naga accepts WGSL the runtime then rejects — which is the
# single failure that test exists to catch, so a skew here silently turns
# the gate off.
naga = { version = "30", features = ["wgsl-in"] }
winit = "0.30"
glam = "0.33"
crossbeam-channel = "0.5"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rustc-hash = "2"
# Glyph rasterization. Default features on purpose: `simd` is cfg'd to
# x86/x86_64 inside the crate (a no-op on wasm/aarch64), and `hashbrown`
# is what keeps fontdue no_std. Never enable `parallel` — it pulls rayon
# and breaks the wasm build.
fontdue = "0.9"
rand = "0.10"
# std::time::Instant re-export on native, performance.now() on wasm32 —
# the workspace-wide Instant so every crate stays wasm-clean.
web-time = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
env_logger = "0.11"
pollster = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
tokio = { version = "1", default-features = false }
wtransport = "0.7"
anyhow = "1"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
# Desktop-only audio output (apps/desktop is the sole consumer — the
# engine talks to an injected AudioSink and never sees rodio).
rodio = { version = "0.22", default-features = false, features = ["playback", "vorbis"] }
sha2 = "0.11"
dirs = "6"
# Hands a URL to the system browser, for the desktop sign-in flow. Worth a
# dependency rather than shelling out to `open`/`xdg-open`/`start`: the
# Linux side alone is an xdg-open → gio → kde-open → wslview chain, and a
# sign-in that silently fails to open anything looks like a hang.
open = "5"
# The Account screen's Copy ID button. Nothing else in the project reads or
# writes a clipboard — there is no paste anywhere, deliberately.
arboard = { version = "3", default-features = false }

[profile.release]
lto = "thin"

# Fast iteration but usable framerates while debugging a voxel world.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# `just bench` numbers and release binaries stay untouched; Instruments
# work uses this profile for symbols.
[profile.profiling]
inherits = "release"
debug = true
