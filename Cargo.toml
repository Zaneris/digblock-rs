[workspace]
resolver = "2"
members = [
	"crates/digblock-core",
	"crates/digblock-render",
	"crates/digblock-assets",
	"crates/digblock-platform",
	"crates/digblock-net",
	"crates/digblock-net-native",
	"crates/digblock-net-web",
	"apps/desktop",
	"apps/ios",
	"apps/server",
	"apps/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Mirrors the justfile/CI `-D warnings` policy in-source, so plain
# `cargo build` and rust-analyzer surface it instead of `just check`
# discovering it later. Each crate opts in via `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
digblock-core = { path = "crates/digblock-core" }
digblock-render = { path = "crates/digblock-render" }
digblock-assets = { path = "crates/digblock-assets" }
digblock-platform = { path = "crates/digblock-platform" }
digblock-net = { path = "crates/digblock-net" }
digblock-net-native = { path = "crates/digblock-net-native" }
digblock-net-web = { path = "crates/digblock-net-web" }

wgpu = "26"
winit = "0.30"
glam = "0.30"
crossbeam-channel = "0.5"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rustc-hash = "2"
rand = "0.9"
# std::time::Instant re-export on native, performance.now() on wasm32 —
# the workspace-wide Instant so every crate stays wasm-clean.
web-time = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
tokio = { version = "1", default-features = false }
wtransport = "0.7"
anyhow = "1"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"

[profile.release]
lto = "thin"

# Fast iteration but usable framerates while debugging a voxel world.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# `just bench` numbers and release binaries stay untouched; Instruments
# work uses this profile for symbols.
[profile.profiling]
inherits = "release"
debug = true
